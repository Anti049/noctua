# Splash screen for the stable flavor: dart run flutter_native_splash:create --flavors stable,beta
# The logo with the system theme behind it: Catppuccin Latte in light mode, Mocha in dark mode.
flutter_native_splash:
    color: '#EFF1F5'
    image: assets/branding/splash_stable_legacy.png
    color_dark: '#1E1E2E'
    image_dark: assets/branding/splash_stable_legacy.png
    android_12:
        color: '#EFF1F5'
        image: assets/branding/splash_stable.png
        color_dark: '#1E1E2E'
        image_dark: assets/branding/splash_stable.png
    ios: false
    web: false
